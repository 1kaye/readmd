[package]
name = "readmd"
version = "0.1.0"
edition = "2024"
description = "Keyboard-first Markdown reader and editor built with GPUI"
license = "MIT"

[dependencies]
gpui-kit = { version = "0.11.0", default-features = false, features = ["gpui-fast"] }
rfd = "0.18.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
